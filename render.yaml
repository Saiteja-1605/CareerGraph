services:
  # CareerGraph Backend Web Service
  - type: web
    name: careergraph-backend
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm run install:all && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://careergraph-frontend-jqbu.onrender.com

  # CareerGraph Frontend Static Site
  - type: web
    name: careergraph-frontend
    runtime: static
    autoDeploy: true
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://careergraph-backend-ozb8.onrender.com
